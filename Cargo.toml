[package]
name = "windissect"
version = "1.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/razecrs/windissect"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
goblin = "0.10.7"
msvc-demangler = "0.11.0"
pdb = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
iced-x86 = "1.22.0"
windows-metadata = "0.100"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_RestartManager",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]
members = [".", "gui"]
