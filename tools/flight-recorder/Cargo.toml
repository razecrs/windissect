[package]
name = "windissect-flight-recorder"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Low-overhead DXGI desktop flight recorder"

[dependencies]
windissect-dxgi = { package = "dxgi-sys", path = "../../rust/dxgi" }
windissect-d3d11 = { package = "d3d11-sys", path = "../../rust/d3d11" }
windissect-mfplat = { package = "mfplat-sys", path = "../../rust/mfplat" }
windissect-mfreadwrite = { package = "mfreadwrite-sys", path = "../../rust/mfreadwrite" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Performance",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

